let lastSocketAt = 0;
async function fetchLanyard(){
  if(document.hidden) return;
  const started = Date.now();
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 8000);
  try{
    const res = await fetch('https://api.lanyard.rest/v1/users/' + DISCORD_USER_ID, { signal: ctl.signal });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const json = await res.json();
    if(lastSocketAt > started) return;      // 더 최신인 소켓 상태를 덮어쓰지 않음
    if(json && json.success && json.data && typeof json.data === 'object'){ applyLanyardData(json.data); }
  }catch(err){ console.error('fetchLanyard failed:', err); }
  finally{ clearTimeout(timer); }
}

function connectLanyardSocket(){
  let ws;
  let heartbeat = null, attempt = 0;
  function clearBeat(){ if(heartbeat){ clearInterval(heartbeat); heartbeat = null; } }
  function open(){
    try{ ws = new WebSocket('wss://api.lanyard.rest/socket'); }catch(err){ console.error('lanyard socket creation failed, retrying:', err); setTimeout(open, 4000); return; }
    ws.onmessage = (ev) => {
      let msg;
      try{ msg = JSON.parse(ev.data); }catch(e){ console.error('lanyard socket: bad message payload:', e); return; }
      if(msg.op === 1){
        clearBeat();
        heartbeat = setInterval(() => {
          try{ ws.send(JSON.stringify({ op: 3 })); }catch(e){ console.error('lanyard socket heartbeat send failed:', e); }
        }, msg.d.heartbeat_interval);
        ws.send(JSON.stringify({ op: 2, d: { subscribe_to_id: DISCORD_USER_ID } }));
      }
      if(msg.t === 'INIT_STATE' || msg.t === 'PRESENCE_UPDATE'){
        attempt = 0; lastSocketAt = Date.now();
        applyLanyardData(unwrapLanyardPayload(msg.d));
      }
    };
    ws.onclose = () => {
      clearBeat();
      const delay = Math.min(30000, 1000 * Math.pow(2, attempt++)) + Math.random() * 1000;   // 점진적 + 무작위 지연
      setTimeout(open, delay);
    };
    ws.onerror = (ev) => {
      console.error('lanyard socket error, reconnecting:', ev);
      try{ ws.close(); }catch(e){ console.error('lanyard socket close after error failed:', e); }
    };
  }
  open();
}

const WING_SFX_SRC = "https://raw.githubusercontent.com/fixk1234/12344/cf6eadc9a9cba1620462478222bda2eb2415ac94/kula-diamond-bye-bye-_v_-made-with-Voicemod.mp3";
const wingEl = document.getElementById('sigilWings');
let wingSfx = null;
let wingSfxCtx = null;
let wingSfxGain = null;
let wingSfxBoosted = false;

function setupWingSfxBoost(){
  if(wingSfxBoosted || !wingSfx) return;
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    wingSfxCtx = new AC();
    const src = wingSfxCtx.createMediaElementSource(wingSfx);
    wingSfxGain = wingSfxCtx.createGain();
    wingSfxGain.gain.value = 2.6;
    const limiter = wingSfxCtx.createDynamicsCompressor();   // 증폭 시 갑작스러운 큰 소리 방지
    src.connect(wingSfxGain).connect(limiter).connect(wingSfxCtx.destination);
    wingSfxBoosted = true;
  }catch(err){ console.error('wing sfx gain boost setup failed:', err); }
}

function wingClickEffects(el){
  if(!fxOn()) return;
  const r = el.getBoundingClientRect();
  const x = r.left + r.width / 2, y = r.top + r.height * .55;
  const cs = getComputedStyle(document.documentElement);
  const colors = [cs.getPropertyValue('--wing-feather').trim(), cs.getPropertyValue('--wing-edge-2').trim(), cs.getPropertyValue('--st-accent').trim(), '#ffffff'];
  function add(cls, x, y, duration){
    const n = document.createElement('span');
    n.className = 'wing-click-fx ' + cls;
    n.style.left = x + 'px'; n.style.top = y + 'px';
    n.style.setProperty('--dur', duration + 's');
    n.addEventListener('animationend', () => n.remove(), {once:true});
    document.body.appendChild(n);
    setTimeout(() => n.remove(), duration * 1000 + 200);
    return n;
  }
  add('wing-click-ring', x, y, .55);
  for(let i=0;i<12;i++){
    const a = Math.PI * 2 * i / 12 + Math.random() * .4 - .2;
    const d = 50 + Math.random() * 70;
    const n = add('wing-click-particle', x, y, .75 + Math.random() * .55);
    n.style.width = n.style.height = (2 + Math.random() * 3.4) + 'px';
    n.style.setProperty('--dx', Math.cos(a) * d + 'px');
    n.style.setProperty('--dy', Math.sin(a) * d + 'px');
    n.style.setProperty('--c', colors[Math.floor(Math.random()*colors.length)] || '#ffffff');
  }
  for(let i=0;i<16;i++) setTimeout(() => {
    if(!fxOn()) return;
    const left = Math.random() < .5;
    const x = left ? r.left+r.width*(.05+Math.random()*.3) : r.left+r.width*(.65+Math.random()*.3);
    const n = add('wing-click-feather', x, r.top+r.height*(.2+Math.random()*.5), .8+Math.random()*.7);
    n.style.setProperty('--dx', (left ? -1 : 1)*(20+Math.random()*60)+'px');
    n.style.setProperty('--dy', (40+Math.random()*90)+'px');
  }, i*30);
}
